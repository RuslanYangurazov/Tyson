<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Челлендж Тайсона</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1a1a1a; --sub:#6b7280; --border:#e5e7eb;
  --green:#22c55e; --green-t:#16a34a; --yellow:#facc15; --yellow-t:#a16207;
  --red:#ef4444; --red-t:#b91c1c; --accent:#6366f1; --accent-t:#4f46e5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --card:#1c1e22; --text:#f2f2f2; --sub:#9aa0a6; --border:#2c2f34;
  }
}
:root[data-theme="dark"]{
  --bg:#121316; --card:#1c1e22; --text:#f2f2f2; --sub:#9aa0a6; --border:#2c2f34;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%;}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100%;
}
.wrap{max-width:480px; margin:0 auto; padding:12px 12px 90px;}

/* top panel */
.panel{
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:14px; margin-bottom:14px;
}
.hello{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.hello span{font-size:14px; font-weight:600; color:var(--sub);}
.editname{background:none; border:none; font-size:13px; cursor:pointer; opacity:.6; padding:2px 4px;}
.streak{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.streak-num{font-size:28px; font-weight:800; color:var(--accent);}
.streak-label{font-size:12px; color:var(--sub); max-width:160px; text-align:right; line-height:1.3;}
.stats-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.stat-block{background:var(--bg); border-radius:12px; padding:8px 10px;}
.stat-title{font-size:11px; color:var(--sub); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px;}
.stat-row{display:flex; justify-content:space-between; font-size:13px; padding:1px 0;}
.stat-row b{font-variant-numeric:tabular-nums;}

/* month nav */
.monthbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.monthbar button{
  background:var(--card); border:1px solid var(--border); color:var(--text);
  width:38px; height:38px; border-radius:10px; font-size:18px; cursor:pointer;
}
.monthbar h2{font-size:16px; margin:0; text-transform:capitalize;}

/* calendar */
.dow{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-bottom:5px;}
.dow span{text-align:center; font-size:11px; color:var(--sub);}
.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
.cell{
  aspect-ratio:1/1; border-radius:10px; padding:4px 2px 3px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  font-size:10px; line-height:1.15; color:#fff; position:relative; border:none;
  font-family:inherit;
}
.cell.empty{background:transparent; cursor:default;}
.cell .d{font-size:12px; font-weight:700; margin-bottom:2px;}
.cell.green{background:var(--green);}
.cell.yellow{background:var(--yellow); color:#3a2e00;}
.cell.red{background:var(--red);}
.cell.today{outline:2px solid var(--accent); outline-offset:-2px;}
.cell .nums{font-size:9px; opacity:.95;}

/* fab */
.fab{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--accent); color:#fff; border:none; border-radius:999px;
  padding:13px 22px; font-size:14px; font-weight:600; cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.25); max-width:440px; width:calc(100% - 24px);
}

/* modal */
.overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:none;
  align-items:flex-end; justify-content:center; z-index:50;
}
.overlay.open{display:flex;}
.modal{
  background:var(--card); width:100%; max-width:480px; border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:88vh; overflow-y:auto;
}
.modal h3{margin:0 0 4px;}
.modal .date-sub{color:var(--sub); font-size:13px; margin-bottom:16px;}
.exercise{margin-bottom:16px; background:var(--bg); border-radius:14px; padding:12px;}
.exercise h4{margin:0 0 10px; font-size:14px;}
.fields{display:flex; gap:10px;}
.field{flex:1;}
.field label{font-size:11px; color:var(--sub); display:block; margin-bottom:4px;}
.field input{
  width:100%; padding:10px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:16px;
}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.btn{flex:1; padding:12px; border-radius:12px; border:none; font-size:14px; font-weight:600; cursor:pointer;}
.btn-save{background:var(--accent); color:#fff;}
.btn-cancel{background:var(--bg); color:var(--text); border:1px solid var(--border);}
.btn-clear{background:var(--bg); color:var(--red-t); border:1px solid var(--border);}
</style>
</head>
<body>
<div class="wrap">

  <div class="panel">
    <div class="hello" id="helloRow">
      <span id="helloText">Привет!</span>
      <button id="editNameBtn" class="editname">✏️</button>
    </div>
    <div class="streak">
      <div><div class="streak-num" id="streakNum">0</div><div style="font-size:12px;color:var(--sub);">дней подряд</div></div>
      <div class="streak-label">Сколько дней подряд держится челлендж</div>
    </div>
    <div class="stats-grid">
      <div class="stat-block">
        <div class="stat-title">Подтягивания</div>
        <div class="stat-row"><span>Сегодня</span><b id="pu-today">0</b></div>
        <div class="stat-row"><span>За месяц</span><b id="pu-month">0</b></div>
        <div class="stat-row"><span>Всего</span><b id="pu-total">0</b></div>
      </div>
      <div class="stat-block">
        <div class="stat-title">Тайсоны</div>
        <div class="stat-row"><span>Сегодня</span><b id="ty-today">0</b></div>
        <div class="stat-row"><span>За месяц</span><b id="ty-month">0</b></div>
        <div class="stat-row"><span>Всего</span><b id="ty-total">0</b></div>
      </div>
    </div>
  </div>

  <div class="monthbar">
    <button id="prevBtn">‹</button>
    <h2 id="monthTitle">—</h2>
    <button id="nextBtn">›</button>
  </div>

  <div class="dow" id="dow"></div>
  <div class="grid" id="grid"></div>
</div>

<button class="fab" id="fabBtn">➕ Внести сегодня</button>

<div class="overlay" id="nameOverlay">
  <div class="modal">
    <h3>Как вас зовут?</h3>
    <div class="date-sub">Имя будет показано на верхней панели</div>
    <div class="exercise">
      <div class="field"><input type="text" id="nameInput" placeholder="Например, Алекс" maxlength="30"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-save" id="nameSaveBtn" style="flex:1;">Сохранить</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Сегодня</h3>
    <div class="date-sub" id="modalDate"></div>

    <div class="exercise">
      <h4>🏋️ Подтягивания</h4>
      <div class="fields">
        <div class="field"><label>Подходов</label><input type="number" min="0" id="puSets" inputmode="numeric"></div>
        <div class="field"><label>Всего раз</label><input type="number" min="0" id="puReps" inputmode="numeric"></div>
      </div>
    </div>

    <div class="exercise">
      <h4>🥊 Тайсоны</h4>
      <div class="fields">
        <div class="field"><label>Подходов</label><input type="number" min="0" id="tySets" inputmode="numeric"></div>
        <div class="field"><label>Всего раз</label><input type="number" min="0" id="tyReps" inputmode="numeric"></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-cancel" id="cancelBtn">Отмена</button>
      <button class="btn btn-clear" id="clearBtn">Очистить день</button>
      <button class="btn btn-save" id="saveBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'tysonChallengeData_v1';
const NAME_KEY = 'tysonChallengeName_v1';
const DOW_LABELS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MONTH_NAMES = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

let data = {};
try{
  const raw = localStorage.getItem(STORAGE_KEY);
  data = raw ? JSON.parse(raw) : {};
}catch(e){ data = {}; }

let viewYear, viewMonth; // viewMonth 0-11
let editingDateStr = null;

const todayD = new Date();
const todayStr = fmt(todayD);
viewYear = todayD.getFullYear();
viewMonth = todayD.getMonth();

function fmt(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function saveData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
}
function isComplete(entry){
  return entry && entry.pu && entry.ty && (entry.pu.reps>0) && (entry.ty.reps>0);
}

function getName(){
  try{ return localStorage.getItem(NAME_KEY) || ''; }catch(e){ return ''; }
}
function setName(n){
  try{ localStorage.setItem(NAME_KEY, n); }catch(e){}
}
function renderHello(){
  const n = getName();
  document.getElementById('helloText').textContent = n ? `Привет, ${n}!` : 'Привет!';
}
function openNameModal(){
  document.getElementById('nameInput').value = getName();
  document.getElementById('nameOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('nameInput').focus(), 100);
}
function closeNameModal(){
  document.getElementById('nameOverlay').classList.remove('open');
}
document.getElementById('editNameBtn').addEventListener('click', openNameModal);
document.getElementById('nameSaveBtn').addEventListener('click', ()=>{
  const val = document.getElementById('nameInput').value.trim();
  setName(val);
  renderHello();
  closeNameModal();
  maybeOpenTodayModal();
});
document.getElementById('nameInput').addEventListener('keydown', (e)=>{
  if(e.key==='Enter') document.getElementById('nameSaveBtn').click();
});

function renderDow(){
  const dow = document.getElementById('dow');
  dow.innerHTML = DOW_LABELS.map(l=>`<span>${l}</span>`).join('');
}

function renderCalendar(){
  const title = document.getElementById('monthTitle');
  title.textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  let startOffset = firstOfMonth.getDay(); // 0=Sun
  startOffset = (startOffset === 0) ? 6 : startOffset - 1; // make Monday=0

  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  for(let i=0;i<startOffset;i++){
    const empty = document.createElement('div');
    empty.className='cell empty';
    grid.appendChild(empty);
  }

  for(let day=1; day<=daysInMonth; day++){
    const dStr = fmt(new Date(viewYear, viewMonth, day));
    const entry = data[dStr];
    const cell = document.createElement('button');
    cell.type='button';
    cell.className='cell';

    let state;
    if(isComplete(entry)) state='green';
    else if(dStr >= todayStr) state='yellow';
    else state='red';
    cell.classList.add(state);
    if(dStr === todayStr) cell.classList.add('today');

    let numsHtml = '';
    if(entry){
      const puS = entry.pu ? entry.pu.sets||0 : 0, puR = entry.pu ? entry.pu.reps||0 : 0;
      const tyS = entry.ty ? entry.ty.sets||0 : 0, tyR = entry.ty ? entry.ty.reps||0 : 0;
      if(puR>0) numsHtml += `<div class="nums">П ${puS}×${puR}</div>`;
      if(tyR>0) numsHtml += `<div class="nums">Т ${tyS}×${tyR}</div>`;
    }
    cell.innerHTML = `<div class="d">${day}</div>${numsHtml}`;
    cell.addEventListener('click', ()=>openModal(dStr));
    grid.appendChild(cell);
  }
}

function computeStreak(){
  let streak = 0;
  let cursor = new Date(todayD);
  // if today not complete yet, start counting from yesterday
  if(!isComplete(data[fmt(cursor)])){
    cursor.setDate(cursor.getDate()-1);
  }
  while(isComplete(data[fmt(cursor)])){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  return streak;
}

function sumRange(predicate){
  let pu=0, ty=0;
  for(const key in data){
    if(predicate(key)){
      const e = data[key];
      if(e.pu) pu += (e.pu.reps||0);
      if(e.ty) ty += (e.ty.reps||0);
    }
  }
  return {pu, ty};
}

function renderStats(){
  document.getElementById('streakNum').textContent = computeStreak();

  const todayEntry = data[todayStr];
  document.getElementById('pu-today').textContent = todayEntry && todayEntry.pu ? (todayEntry.pu.reps||0) : 0;
  document.getElementById('ty-today').textContent = todayEntry && todayEntry.ty ? (todayEntry.ty.reps||0) : 0;

  const monthPrefix = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-`;
  const monthSum = sumRange(k=>k.startsWith(monthPrefix));
  document.getElementById('pu-month').textContent = monthSum.pu;
  document.getElementById('ty-month').textContent = monthSum.ty;

  const totalSum = sumRange(()=>true);
  document.getElementById('pu-total').textContent = totalSum.pu;
  document.getElementById('ty-total').textContent = totalSum.ty;
}

function renderAll(){
  renderCalendar();
  renderStats();
}

function openModal(dateStr){
  editingDateStr = dateStr;
  const entry = data[dateStr];
  document.getElementById('modalTitle').textContent = dateStr===todayStr ? 'Сегодня' : 'Запись за день';
  const d = new Date(dateStr+'T00:00:00');
  document.getElementById('modalDate').textContent = d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric', weekday:'long'});
  document.getElementById('puSets').value = entry && entry.pu ? entry.pu.sets||'' : '';
  document.getElementById('puReps').value = entry && entry.pu ? entry.pu.reps||'' : '';
  document.getElementById('tySets').value = entry && entry.ty ? entry.ty.sets||'' : '';
  document.getElementById('tyReps').value = entry && entry.ty ? entry.ty.reps||'' : '';
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  editingDateStr = null;
}

document.getElementById('fabBtn').addEventListener('click', ()=>openModal(todayStr));
document.getElementById('cancelBtn').addEventListener('click', closeModal);
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

document.getElementById('saveBtn').addEventListener('click', ()=>{
  if(!editingDateStr) return;
  const puSets = parseInt(document.getElementById('puSets').value)||0;
  const puReps = parseInt(document.getElementById('puReps').value)||0;
  const tySets = parseInt(document.getElementById('tySets').value)||0;
  const tyReps = parseInt(document.getElementById('tyReps').value)||0;

  if(puReps===0 && tyReps===0 && puSets===0 && tySets===0){
    delete data[editingDateStr];
  } else {
    data[editingDateStr] = {
      pu:{sets:puSets, reps:puReps},
      ty:{sets:tySets, reps:tyReps}
    };
  }
  saveData();
  closeModal();
  renderAll();
});

document.getElementById('clearBtn').addEventListener('click', ()=>{
  if(!editingDateStr) return;
  delete data[editingDateStr];
  saveData();
  closeModal();
  renderAll();
});

document.getElementById('prevBtn').addEventListener('click', ()=>{
  viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;}
  renderAll();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;}
  renderAll();
});

function maybeOpenTodayModal(){
  if(!data[todayStr]){
    setTimeout(()=>openModal(todayStr), 300);
  }
}

renderDow();
renderAll();
renderHello();

// on first launch ask for a name, then move on to today's entry
if(!getName()){
  setTimeout(openNameModal, 200);
} else {
  maybeOpenTodayModal();
}
</script>
</body>
</html>
